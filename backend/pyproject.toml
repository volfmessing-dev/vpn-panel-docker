[project]
name = "bypass-manager-backend"
version = "0.1.0"
description = "FastAPI backend for Amnezia bypass network management"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "fastapi>=0.111.0",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "qrcode>=7.4.2",
    "sqlalchemy>=2.0.31",
    "uvicorn>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
