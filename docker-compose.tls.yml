services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic-tls.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:80:80"
      - "${PANEL_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ./traefik/dynamic-tls.yml:/etc/traefik/dynamic-tls.yml:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bypass_manager}
      POSTGRES_USER: ${POSTGRES_USER:-bypass_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bypass_manager}:${POSTGRES_PASSWORD:?Run setup first}@postgres:5432/${POSTGRES_DB:-bypass_manager}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SSH_KEY_PATH: ${SSH_KEY_PATH:-/run/secrets/ssh/id_ed25519}
      BYPASS_DOMAINS_PATH: ${BYPASS_DOMAINS_PATH:-/data/bypass-domains.txt}
    volumes:
      - ./secrets/ssh:/run/secrets/ssh:ro
      - backend_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:

  traefik_letsencrypt:
